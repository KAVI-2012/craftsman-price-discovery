services:
  - type: web
    name: craftsman-price-discovery
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.10.0
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
